[project]
name = "cycirequests"
version = "1.0.0"
description = "A library for making requests to the Cyciri API"
authors = [
    {name = "cyciri",email = "cyrille.billard@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
